<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulation config · Ax3l</title>
  {% include "report_styles.html" %}
</head>
<body>
  <header><h1>Simulation config</h1><a href="/">Back to event log</a></header>
  <p>Run: {{ run_id }}</p>
  <main class="panel">
    <table aria-label="Simulation configuration">
      {% for path, value in rows %}
      <tr><th scope="row">{{ field_labels.get(path, path) }}</th><td>{{ value }}</td></tr>
      {% endfor %}
    </table>
  </main>
</body>
</html>
