<style>
    :root { color-scheme: dark; --text: #d5dfeb; --link: #79b8f3; --muted: #a7b8cb; --border: #40566e; }
    * { box-sizing: border-box; }
    body { margin: 1.5rem auto; padding: 1rem; max-width: 1200px; background: #0b1119; color: var(--text); font: 15px/1.6 "Courier New", Courier, monospace; }
    header, section { border: 1px solid var(--border); margin-bottom: 1rem; background: #101720; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem; }
    h1, .server-bar h2 { margin: 0; font-size: 1.5rem; }
    h2 { margin: 0; padding: .6rem 1rem; border-bottom: 1px solid var(--border); background: #151f2b; font-size: 1rem; }
    a { color: var(--link); border: 1px solid var(--border); padding: .4rem .75rem; }
    a:hover { background: #23364b; }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    pre { margin: 0; padding: 1rem; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; vertical-align: top; overflow-wrap: anywhere; white-space: pre-wrap; }
    th { width: 38%; color: var(--muted); font-weight: normal; }
    tr:nth-child(even) { background: #172331; }
    @media (max-width: 600px) { body { margin: 0; padding: .5rem; } }
    figure { margin: 1rem; }
    img { display: block; max-width: 100%; height: auto; }
    .simulation-board { display: block; max-width: 100%; height: auto; margin: auto; }
    .simulation-board-panel { margin: 1rem; }
    p { overflow-wrap: anywhere; color: var(--muted); }
    main.panel { border: 1px solid var(--border); background: #101720; overflow-x: auto; }
    .chart-page main { padding: .5rem; }
    .report-description { padding: 1rem; }
    .report-description p:first-child { margin-top: 0; }
    .report-description p:last-child { margin-bottom: 0; }
    .wide-table { table-layout: auto; }
    .wide-table th { width: auto; background: #151f2b; }
    .wide-table th, .wide-table td { white-space: nowrap; }
    td a { padding: 0; border: 0; text-underline-offset: .2em; }
    body.events-page { max-width: none; }
    body.golden-configurations-page { max-width: 1600px; }
    .server-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem; }
    .server-bar h2 { padding: 0; border: 0; background: transparent; }
    .event-log-panel { padding: 1rem; }
    .event-log-panel > header { border: 0; padding: 0; }
    #last-refreshed { white-space: nowrap; }
    .experiment-status { flex-direction: column; align-items: flex-start; gap: .5rem; }
    .experiment-layout { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; width: 100%; }
    .experiment-summary, .experiment-reports { width: 100%; min-width: 0; border: 1px solid var(--border); padding: .75rem 1rem; }
    .experiment-metrics, .report-links { display: flex; flex-direction: column; align-items: flex-start; gap: .35rem; }
    .experiment-summary, .experiment-reports, .experiment-board { margin: 0; }
    .experiment-summary h3, .experiment-reports h3 { margin: 0 0 .75rem; font-size: 1.1rem; }
    .experiment-board { grid-column: 2; grid-row: 1 / 3; align-self: start; justify-self: center; min-width: 0; max-width: 100%; border: 1px solid var(--border); padding: .75rem; background: #101720; }
    #current-board { width: fit-content; max-width: 100%; border: 1px solid var(--border); background: #101720; }
    #current-board p { max-width: 320px; margin: 0; padding: 1rem; }
    .experiment-board .simulation-board { max-height: 360px; max-width: min(360px, 100%); width: auto; }
    .experiment-board figcaption { margin-top: .5rem; text-align: center; color: var(--muted); }
    @media (max-width: 700px) {
      .experiment-layout { grid-template-columns: minmax(0, 1fr); }
      .experiment-board { grid-column: auto; grid-row: auto; }
    }
    .report-links a { border: 0; padding: 0; overflow-wrap: anywhere; }
    .note { margin: 1rem 0; padding: .6rem 1rem; border: 1px solid var(--border); }
    .events-page th:not(:last-child), .events-page td:not(:last-child) { width: 1%; }
    .entry:hover { background: #23364b; }
    .metadata { color: var(--muted); }
    .content { max-width: 0; overflow: hidden; text-overflow: ellipsis; font: inherit; }
    select { padding: .35rem .65rem; border: 1px solid var(--border); background: #101720; color: var(--text); font: inherit; }
    select:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
    .empty { margin: 0; padding: 1rem; }
    ::selection { background: #79b8f3; color: #0b1119; }
  </style>
